name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run unit and structural tests
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q afterline main.py
      - name: Verify site assets
        run: test -s website/index.html && test -s website/style.css && test -s website/app.js
