name: Packages

# Builds the installable packages for every supported distribution (each in a
# clean container of that distribution, with all tests as a gate), installs
# every package into a *fresh* container and runs it, and publishes a GitHub
# Release with checksums when a version tag (v0.2.0, ...) is pushed, or when
# the workflow is run by hand with "publish" ticked (the release job then
# creates the tag for the version in CMakeLists.txt on the commit it built).
on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'engines/**'
      - 'packaging/**'
      - '.github/workflows/packages.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release for the version in CMakeLists.txt
        type: boolean
        default: false

# A newer push replaces an older build still waiting for machines. Release
# runs (tags, or "publish") are never cancelled.
concurrency:
  group: packages-${{ github.ref }}-${{ github.event_name }}-${{ inputs.publish || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  deb:
    name: ${{ matrix.image }} (.deb)
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Linux Mint 21/22, Pop!_OS and Zorin use the matching Ubuntu package.
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04', 'debian:12', 'debian:13']
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        run: packaging/build-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ strategy.job-index }}
          path: dist/*.deb

  rpm:
    name: ${{ matrix.image }} (.rpm)
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:43', 'fedora:44']
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        run: packaging/build-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ strategy.job-index }}
          path: dist/*.rpm

  arch:
    name: Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git cmake qt6-base qt6-svg pipewire wireplumber opus libogg sqlite hicolor-icon-theme
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build with the PKGBUILD from this commit
        run: |
          git config --system --add safe.directory '*'
          useradd -m builder
          mkdir /pkg
          sed "s|^source=.*|source=(\"\$pkgname::git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA\")|" \
              packaging/arch/PKGBUILD > /pkg/PKGBUILD
          chown -R builder /pkg
          su builder -c 'cd /pkg && makepkg --noconfirm'
          mkdir -p dist && cp /pkg/afterline-[0-9]*-x86_64.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  appimage:
    name: AppImage (any distribution)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  # Every package is installed into a clean container of its distribution
  # (not the one it was built in) and must start and run its engines.
  install-test:
    name: Install ${{ matrix.image }}
    needs: [deb, rpm, arch, appimage]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'ubuntu:22.04', pattern: '*ubuntu-22.04*.deb', kind: deb}
          - {image: 'ubuntu:24.04', pattern: '*ubuntu-24.04*.deb', kind: deb}
          - {image: 'ubuntu:26.04', pattern: '*ubuntu-26.04*.deb', kind: deb}
          - {image: 'debian:12', pattern: '*debian-12*.deb', kind: deb}
          - {image: 'debian:13', pattern: '*debian-13*.deb', kind: deb}
          - {image: 'fedora:43', pattern: '*fedora-43*.rpm', kind: rpm}
          - {image: 'fedora:44', pattern: '*fedora-44*.rpm', kind: rpm}
          - {image: 'archlinux:latest', pattern: 'afterline-[0-9]*-x86_64.pkg.tar.zst', kind: arch}
          - {image: 'debian:13', pattern: '*.AppImage', kind: appimage}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install
        run: |
          set -eu
          pkg=$(ls dist/${{ matrix.pattern }})
          case "${{ matrix.kind }}" in
            deb) apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y "./$pkg" ;;
            rpm) dnf install -y "./$pkg" ;;
            arch) pacman -Syu --noconfirm && pacman -U --noconfirm "./$pkg" ;;
            # The libraries every desktop has and AppImages rely on (the
            # AppImage excludelist): OpenGL, fonts, X11/Wayland, D-Bus, PipeWire.
            appimage) apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y libpipewire-0.3-0t64 \
                        libgl1 libegl1 libopengl0 libfontconfig1 libfreetype6 libharfbuzz0b libxkbcommon0 \
                        libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcb1 libdbus-1-3 libglib2.0-0t64 libcom-err2 libgpg-error0 \
                      && chmod +x "$pkg" && (cd dist && "./$(basename "$pkg")" --appimage-extract >/dev/null) \
                      && missing=$(find dist/squashfs-root -type f \( -name afterline -o -name 'afterline-*' \) -perm -u+x \
                           -exec sh -c 'LD_LIBRARY_PATH=dist/squashfs-root/usr/lib ldd "$1"' _ {} \; | grep "not found" | sort -u) \
                      && { [ -z "$missing" ] || { echo "Missing host libraries:"; echo "$missing"; exit 1; }; } \
                      && ln -s "$PWD/dist/squashfs-root/AppRun" /usr/local/bin/afterline ;;
          esac
      - name: Run
        run: |
          set -eu
          QT_QPA_PLATFORM=offscreen afterline --version
          QT_QPA_PLATFORM=offscreen afterline --help
          if [ "${{ matrix.kind }}" != appimage ]; then
            test -f /usr/share/applications/io.github.Artful_DevA.AfterLine.desktop
            test -f /usr/share/icons/hicolor/scalable/apps/io.github.Artful_DevA.AfterLine.svg
            test -f /usr/share/metainfo/io.github.Artful_DevA.AfterLine.metainfo.xml
            engines=$(dirname "$(find /usr/lib* -path '*/transcriber/afterline-transcriber' -type f | head -1)")/..
          else
            engines=$(dirname "$(find dist/squashfs-root -path '*/transcriber/afterline-transcriber' -type f | head -1)")/..
          fi
          "$engines/transcriber/afterline-transcriber" --version
          "$engines/summarizer/afterline-summarizer" --version
      - name: Uninstall
        if: matrix.kind != 'appimage'
        run: |
          case "${{ matrix.kind }}" in
            deb) apt-get remove -y afterline ;;
            rpm) dnf remove -y afterline ;;
            arch) pacman -R --noconfirm afterline ;;
          esac
          ! command -v afterline

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [install-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version in CMakeLists.txt
        id: version
        run: |
          version=$(sed -n 's/^project(AfterLine VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but CMakeLists.txt says $version"; exit 1; }
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi
          echo "name=AfterLine $version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          files: dist/*
          body_path: packaging/RELEASE_NOTES.md
