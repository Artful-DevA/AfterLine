name: Linux packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deb:
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'ubuntu:22.04', label: 'ubuntu-22.04'}
          - {image: 'ubuntu:24.04', label: 'ubuntu-24.04'}
          - {image: 'ubuntu:26.04', label: 'ubuntu-26.04'}
          - {image: 'debian:12', label: 'debian-12'}
          - {image: 'debian:13', label: 'debian-13'}
    steps:
      - name: Toolchain
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-venv python3-pip python3-dev build-essential binutils patchelf git libglib2.0-0 libgl1 libegl1 libxkbcommon0
      - uses: actions/checkout@v4
      - name: Package
        run: TARGET=deb DISTRO=${{ matrix.label }} VERSION=${GITHUB_REF_NAME#v} bash packaging/build.sh
      - name: Install test
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/*.deb
          test -x /usr/bin/afterline
          /opt/afterline/afterline --help >/dev/null 2>&1 || test -x /opt/afterline/afterline
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.label }}
          path: dist/*.deb
  rpm:
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - run: dnf install -y python3 python3-pip python3-devel gcc gcc-c++ make rpm-build git patchelf mesa-libGL libxkbcommon glib2
      - uses: actions/checkout@v4
      - name: Package
        run: TARGET=rpm VERSION=${GITHUB_REF_NAME#v} bash packaging/build.sh
      - name: Install test
        run: dnf install -y ./dist/*.rpm && test -x /usr/bin/afterline
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora-43
          path: dist/*.rpm
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed python python-pip base-devel git patchelf zstd
      - uses: actions/checkout@v4
      - name: Package
        run: TARGET=arch VERSION=${GITHUB_REF_NAME#v} bash packaging/build.sh
      - name: Install test
        run: pacman -U --noconfirm ./dist/*.pkg.tar.zst && test -x /usr/bin/afterline
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst
  appimage:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-venv python3-pip python3-dev build-essential git patchelf binutils curl ca-certificates file libglib2.0-0 libgl1 libegl1 libxkbcommon0
      - uses: actions/checkout@v4
      - name: Install AppImage builder
        run: |
          curl -fL --retry 3 https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          cd /tmp && ./appimagetool.AppImage --appimage-extract >/dev/null
          printf '#!/bin/sh\nexec /tmp/squashfs-root/AppRun "$@"\n' > /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
      - name: Package
        run: TARGET=appimage VERSION=${GITHUB_REF_NAME#v} bash packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm, arch, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA-256 hashes
        run: cd dist && sha256sum *.deb *.rpm *.pkg.tar.zst *.AppImage >SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
