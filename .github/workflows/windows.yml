name: Windows

# Builds AfterLine for Windows (MSYS2 UCRT64: GCC, Qt 6, Opus, SQLite), runs
# the tests including a Windows audio smoke test, and builds the installer.
# Publishing it with releases comes once the Windows version has been tried
# on real machines.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'engines/**'
      - 'cmake/**'
      - 'tests/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'packaging/windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Build for Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-sqlite3
            git
      - name: Build and test
        run: packaging/windows/build.sh
      - name: Run the engines from the packaged folder
        run: |
          for e in transcriber summarizer; do
            dist/AfterLine/lib/afterline/$e/afterline-$e.exe --version
          done
          ls dist/AfterLine/bin
      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^project(AfterLine VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\afterline.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/AfterLine-*-Setup.exe
