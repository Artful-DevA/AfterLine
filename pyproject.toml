[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterline"
version = "0.1.0"
description = "Offline-first Linux meeting capture and notes"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7", "faster-whisper>=1.1,<2", "huggingface_hub>=0.26,<2"]

[project.scripts]
afterline = "afterline.ui:main"

[tool.setuptools.packages.find]
include = ["afterline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
