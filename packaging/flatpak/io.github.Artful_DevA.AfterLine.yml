# Flatpak build of AfterLine (Flathub). Build locally with:
#   flatpak-builder --user --install-deps-from=flathub --force-clean build \
#     packaging/flatpak/io.github.Artful_DevA.AfterLine.yml
# For the Flathub submission the first source becomes a git source pinned to
# the release tag and commit (see packaging/flatpak/README.md).
id: io.github.Artful_DevA.AfterLine
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: afterline
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Recording: AfterLine talks to PipeWire directly to capture one
  # application's audio, the whole computer, and the microphone.
  - --filesystem=xdg-run/pipewire-0
  # Downloading the speech and notes models (once, on request).
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: afterline
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DAFTERLINE_BUILD_TESTS=OFF
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - -DFETCHCONTENT_SOURCE_DIR_WHISPER=/run/build/afterline/third_party/whisper.cpp
      - -DFETCHCONTENT_SOURCE_DIR_LLAMA=/run/build/afterline/third_party/llama.cpp
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - build
          - dist
      - type: git
        url: https://github.com/ggml-org/whisper.cpp.git
        tag: v1.9.5
        commit: d1be6fde11ac6e0407606b4e42fe72d34add8037
        dest: third_party/whisper.cpp
      - type: git
        url: https://github.com/ggml-org/llama.cpp.git
        tag: b12248
        commit: 3837bf0bc02ea5d08f8ee3585fc8c7784a81bce8
        dest: third_party/llama.cpp
